# The shipped default profile (02 "Shipped files"); also the built-in safe
# profile (SAFETY-04), which replaces selection and activation with the fixed
# safe values.
schema: uca/1
profile:
  name: Default
  # Click an item to activate it (02 "Selection and activation").
  behavior: { selection: direct, activation: [press] }
  start_board: qwerty
  inputs:
    pointer_source: mouse
    sources:
      mouse: { enabled: true, filter: { kind: none } }
  safety:
    escape: "key:* hold(3000)"
  bindings:
    - when: "mouse:left press"
      do: { select: }
