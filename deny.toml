# SPDX-License-Identifier: GPL-3.0-or-later

# Licence policy from 18-licensing.md. Anything not listed (GPL-2.0-only,
# proprietary, non-commercial, SSPL, unknown) is rejected.
# The plugin interface crates get a stricter, permissive-only list when they
# are added (18-licensing.md).

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]

# Dependencies come only from crates.io: no git dependencies, no other registries.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
