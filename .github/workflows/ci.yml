name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: No hard-coded timings in engine crates (02)
        shell: bash
        run: |
          python -I tools/check-timing-literals.py --self-test
          python -I tools/check-timing-literals.py
      - name: User-visible strings go through uca-i18n (17)
        shell: bash
        run: |
          python -I tools/check-ui-strings.py --self-test
          python -I tools/check-ui-strings.py

  licences:
    name: cargo deny, reuse lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo install cargo-deny --locked
      - run: cargo deny check licenses sources
      - run: pip install "reuse[charset-normalizer]"
      - run: reuse lint

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # 18-licensing.md: every commit needs a Signed-off-by matching its author.
          failed=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qxF "$author"; then
              echo "::error::Commit $c has no 'Signed-off-by: $author'"
              failed=1
            fi
          done
          exit $failed
