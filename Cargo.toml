[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/tqphan/uca"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
schemars = "1"
serde_json = "1"
notify = "8"
tracing = "0.1"
fluent-bundle = "0.16"
unic-langid = "0.9"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
smol_str = "0.3"
thiserror = "2"

[workspace.lints.rust]

[workspace.lints.clippy]
