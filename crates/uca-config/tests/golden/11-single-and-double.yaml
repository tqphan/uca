schema: uca/1
profile:
  name: Alex
  start_board: main
  inputs:
    switches: { s1: "key:F13" }
  safety: { escape: "key:F12 hold(3000)" }
  bindings:
    - { when: "s1", do: { pause: } }
---
schema: uca/1
board: { id: main }
bindings:
  - { when: "key:F13 double(400)", do: { resume: } }
  - { when: "key:F14 double(400)", do: { resume: } }
layers: [ { id: l, layout: { type: row }, items: [ { id: b, action: { board.back: } } ] } ]
