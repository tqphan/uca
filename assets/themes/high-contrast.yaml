# High-contrast theme (05: used when the OS is in high-contrast mode).
schema: uca/1
vars:
  board: "#000000"
  key: "#000000"
  text: "#ffffff"
  edge: "#ffff00"
  modifier-text: "#00ffff"
dwell_indicator: { kind: ring, color: "#00ff00", width: 8 }
groups:
  letters: { style: { background: $key } }
  numbers: { style: { background: $key } }
  punctuations: { style: { background: $key } }
  functions: { style: { background: $key } }
  modifiers: { style: { background: $key, font: { color: $modifier-text } } }
  others: { style: { background: $key } }
templates:
  key:
    border: { width: 4, color: $edge, radius: 4 }
    font: { size: 42%, weight: 700, color: $text }
    padding: 4
    states:
      hover: { border: { color: "#ffffff" } }
