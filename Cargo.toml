[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/tqphan/uca"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
schemars = "1"
serde_json = "1"
notify = "8"
tracing = "0.1"
smol_str = "0.3"
thiserror = "2"

[workspace.lints.rust]

[workspace.lints.clippy]
