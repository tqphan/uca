version = 1

# Spec files at the repo root (18-licensing.md).
[[annotations]]
path = ["AGENTS.md", "0*-*.md", "1*-*.md", "SPEC_GAPS.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The UCA contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Repo plumbing whose format has no comments (18-licensing.md).
[[annotations]]
path = ["Cargo.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The UCA contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Generated JSON Schema, usable by any editor or tool (18-licensing.md).
[[annotations]]
path = ["schema/uca-1.schema.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The UCA contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Test fixtures are part of their crate (18-licensing.md); `.expected` files have no comment syntax.
[[annotations]]
path = ["crates/*/tests/golden/**", "crates/*/tests/data/**", "crates/*/tests/snapshots/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The UCA contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Bundled fonts keep their upstream licence (18-licensing.md).
[[annotations]]
path = ["assets/fonts/noto-sans/**"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts/latin-greek-cyrillic)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["assets/fonts/atkinson-hyperlegible/**"]
precedence = "override"
SPDX-FileCopyrightText = "2020 Braille Institute of America, Inc."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["assets/fonts/lexend/**"]
precedence = "override"
SPDX-FileCopyrightText = "2018 The Lexend Project Authors (https://github.com/googlefonts/lexend)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["assets/fonts/noto-sans-symbols-2/**"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts/symbols)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["assets/fonts/noto-sans-math/**"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts/math)"
SPDX-License-Identifier = "OFL-1.1"

# Prediction base data (16, 18); each pack's prediction/LICENSE names its source and attributions.
# en-US: augur-data's Simple English Wikipedia model.
[[annotations]]
path = ["locales/en-US/prediction/**"]
precedence = "override"
SPDX-FileCopyrightText = ["Wikipedia contributors (Simple English Wikipedia, dump 20260901), see prediction/LICENSE", "The augur-data contributors"]
SPDX-License-Identifier = "CC-BY-SA-4.0"
