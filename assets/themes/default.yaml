# Default theme (02, 10 M1).
schema: uca/1
vars:
  board: "#0b1220"
  key: "#1f2937"
  key-function: "#334155"
  key-modifier: "#3f3a63"
  text: "#f9fafb"
  accent: "#3b82f6"
groups:
  letters: { style: { background: $key } }
  numbers: { style: { background: $key } }
  punctuations: { style: { background: $key } }
  functions: { style: { background: $key-function } }
  modifiers: { style: { background: $key-modifier } }
  others: { style: { background: $key-function } }
templates:
  key:
    border: { width: 2, color: $accent, radius: 10 }
    font: { size: 42%, weight: 700, color: $text }
    padding: 4
